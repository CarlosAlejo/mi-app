apiVersion: apps/v1
kind: Deployment
metadata:
  name: mi-app
  namespace: mi-app
  labels:
    app: mi-app
    pipecd.dev/variant: primary
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mi-app
      pipecd.dev/variant: primary
  template:
    metadata:
      labels:
        app: mi-app
        pipecd.dev/variant: primary
    spec:
      containers:
      - name: helloworld
        image: gcr.io/pipecd/helloworld:v0.1.0
        command: ["/server", "server", "--port=9085"]      # Ruta del binario dentro del contenedor
        args: ["server"]          # Subcomando para iniciar el servidor HTTP
        ports:
        - containerPort: 9085
