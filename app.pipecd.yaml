apiVersion: pipecd.dev/v1beta1
kind: KubernetesApp
spec:
  name: mi-app
  labels:
    env: produccion
  pipeline:
    stages:
      - name: K8S_CANARY_ROLLOUT
        with:
          replicas: 20%          # 20% de los pods son canary
      - name: K8S_PRIMARY_ROLLOUT
      - name: K8S_CANARY_CLEAN
  input:
    manifests:
      - namespace.yaml
      - deployment.yaml
      - service.yaml
