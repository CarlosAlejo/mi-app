apiVersion: pipecd.dev/v1beta1
kind: KubernetesApp
spec:
  name: mi-app
  labels:
    env: produccion
  pipeline:
    stages:
      - name: K8S_CANARY_ROLLOUT
        with:
          replicas: 20%          
      
      - name: ANALYSIS          # Análisis automático con Prometheus
        with:
          duration: 5m          # Tiempo máximo de monitoreo
          metrics:
            - name: error_rate
              query: |
                sum(rate(http_requests_total{app="mi-app", status=~"5.."}[1m])) 
                / 
                sum(rate(http_requests_total{app="mi-app"}[1m]))
              expected:
                max: "0.05"      # <--- AHORA ES UN OBJETO, no un string
              failure: abort    # Si la tasa de error supera el 5%, revierte el canary automáticamente
      
      - name: K8S_PRIMARY_ROLLOUT
      - name: K8S_CANARY_CLEAN
  input:
    manifests:
      - namespace.yaml
      - deployment.yaml
      - service.yaml
