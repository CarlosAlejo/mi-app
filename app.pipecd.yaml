apiVersion: pipecd.dev/v1beta1
kind: KubernetesApp
spec:
  name: mi-app
  labels:
    env: produccion
  pipeline:
    stages:
      - name: K8S_CANARY_ROLLOUT
        with:
          replicas: 20%          
      
      - name: ANALYSIS
        with:
          duration: 5m
          metrics:
            - name: error_rate
              query: |
                sum(rate(http_requests_total{app="mi-app", status=~"5.."}[1m])) 
                / 
                sum(rate(http_requests_total{app="mi-app"}[1m]))
              expected:
                max: 0.05          # <--- SIN COMILLAS, es un número
              failure: abort       # Revierte automáticamente si la tasa supera el 5%
      
      - name: K8S_PRIMARY_ROLLOUT
      - name: K8S_CANARY_CLEAN
  input:
    manifests:
      - namespace.yaml
      - deployment.yaml
      - service.yaml
